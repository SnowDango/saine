name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-master
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm package

      - name: Read package version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Sign extension (CRX)
        run: |
          echo "${{ secrets.EXTENSION_PEM }}" > extension.pem
          pnpm dlx crx3 build/chrome-mv3-prod -p extension.pem -o "saine-${VERSION}.crx"
          rm extension.pem
      - name: Rename ZIP artifact
        run: cp build/chrome-mv3-prod.zip "saine-${VERSION}.zip"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: v${{ env.VERSION }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            saine-${{ env.VERSION }}.crx
            saine-${{ env.VERSION }}.zip
